[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
# Tests marked `live` launch a real Chrome browser and hit
# karaoke-version.com. Excluded from the default run so `pytest tests/unit`
# stays fast and offline. Run integration tests with `pytest -m live`.
markers = [
    "live: integration test requiring a real Chrome session and live network",
]
addopts = "-m 'not live'"

